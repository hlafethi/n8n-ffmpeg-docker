name: Build and Push n8n-ffmpeg Docker Image

on:
  schedule:
    # Verifie tous les jours a 2h du matin
    - cron: '0 2 * * *'
  workflow_dispatch: # Permet de lancer manuellement
  push:
    branches: [ main ]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get latest n8n version
        id: n8n_version
        run: |
          LATEST=$(curl -s https://registry.hub.docker.com/v2/repositories/n8nio/n8n/tags | jq -r '.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name' | sort -V | tail -1)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest n8n version: $LATEST"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            N8N_VERSION=${{ steps.n8n_version.outputs.version }}
          tags: |
            fethihla/n8n-ffmpeg:latest
            fethihla/n8n-ffmpeg:${{ steps.n8n_version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
